project_name: pranor-chrono
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pranor-chrono
    main: .
    binary: pranor-chrono
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: pranor-chrono
    builds: [pranor-chrono]
    name_template: "pranor-chrono_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/vyuvaraj/pranor-chrono:{{.Tag}}"
      - "ghcr.io/vyuvaraj/pranor-chrono:latest"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Pranor Chrono"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/vyuvaraj/Pranor Chrono"

brews:
  - name: pranor-chrono
    repository:
      owner: vyuvaraj
      name: homebrew-pranor
    homepage: "https://github.com/vyuvaraj/Pranor Chrono"
    description: "Distributed cron scheduler and job runner from the Pranor platform"
    license: "Apache-2.0"
    install: |
      bin.install "pranor-chrono"
    test: |
      system "#{bin}/pranor-chrono", "--version"

scoops:
  - repository:
      owner: vyuvaraj
      name: scoop-pranor
    homepage: "https://github.com/vyuvaraj/Pranor Chrono"
    description: "Distributed cron scheduler and job runner from the Pranor platform"
    license: "Apache-2.0"


nfpms:
  - id: pranor-chrono-pkg
    package_name: pranor-chrono
    builds: [pranor-chrono]
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/Pranor Chrono
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: Distributed cron job scheduler from the Pranor platform
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/pranor-chrono/README.md
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
release:
  mode: replace
