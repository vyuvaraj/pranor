name: Build & Test Workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.3"

jobs:
  build-test:
    name: "Build & Test: ${{ matrix.module }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - lang
          - gate
          - console
          - vault
          - pulse
          - notify
          - auth
          - secret
          - lock
          - flow
          - chrono
          - cache
          - trace
          - tunnel
          - deploy
          - pool

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out codebase
        uses: actions/checkout@v4

      - name: Build module
        working-directory: ${{ matrix.module }}
        run: |
          echo "==> Building module ${{ matrix.module }}..."
          go build ./...

      - name: Test module
        working-directory: ${{ matrix.module }}
        run: |
          echo "==> Testing module ${{ matrix.module }}..."
          go test ./... -timeout 120s
