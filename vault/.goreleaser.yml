project_name: pranor-vault
version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Primary server daemon
  - id: pranor-vault
    main: ./cmd/pranor-vault
    binary: pranor-vault
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

  # Single unified CLI tool for operators and users
  - id: pranor-vault-cli
    main: ./cmd/pranor-vault
    binary: pranor-vault
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

  # Kubernetes CSI driver — Linux-only (runs as a DaemonSet sidecar)
  - id: csi-driver
    main: ./cmd/csi-driver
    binary: pranor-vault-csi
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

  # Kubernetes operator — Linux-only
  - id: operator
    main: ./cmd/operator
    binary: pranor-vault-operator
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  # Server binary archive (for operators deploying manually)
  - id: pranor-vault-server
    builds: [pranor-vault]
    name_template: "pranor-vault_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

  # CLI archive (for developers)
  - id: pranor-vault-cli-archive
    builds: [pranor-vault-cli]
    name_template: "pranor-vault-cli_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - id: pranor-vault-image
    image_templates:
      - "ghcr.io/vyuvaraj/pranor-vault:{{.Tag}}"
      - "ghcr.io/vyuvaraj/pranor-vault:latest"
    ids: [pranor-vault]
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Pranor Vault"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/vyuvaraj/Pranor Vault"

brews:
  # Publish the CLI to Homebrew (most useful for developers)
  - name: pranor-vault
    ids: [pranor-vault-cli-archive]
    repository:
      owner: vyuvaraj
      name: homebrew-serv
    homepage: "https://github.com/vyuvaraj/Pranor Vault"
    description: "Distributed object and block storage service from the ServVerse platform"
    license: "Apache-2.0"
    install: |
      bin.install "pranor-vault-cli" => "pranor-vault"
    test: |
      system "#{bin}/pranor-vault", "--version"

scoops:
  - ids: [pranor-vault-cli-archive]
    repository:
      owner: vyuvaraj
      name: scoop-serv
    homepage: "https://github.com/vyuvaraj/Pranor Vault"
    description: "Distributed object and block storage service from the ServVerse platform"
    license: "Apache-2.0"


nfpms:
  - id: pranor-vault-pkg
    package_name: pranor-vault
    builds: [pranor-vault]
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/Pranor Vault
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: Object storage service from the ServVerse platform
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/pranor-vault/README.md
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
release:
  mode: replace
