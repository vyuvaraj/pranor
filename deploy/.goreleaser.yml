project_name: pranor-deploy
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pranor-deploy
    main: .
    binary: pranor-deploy
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: pranor-deploy
    builds: [pranor-deploy]
    name_template: "pranor-deploy_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/vyuvaraj/pranor-deploy:{{.Tag}}"
      - "ghcr.io/vyuvaraj/pranor-deploy:latest"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Pranor Deploy"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/vyuvaraj/Pranor Deploy"

brews:
  - name: pranor-deploy
    repository:
      owner: vyuvaraj
      name: homebrew-serv
    homepage: "https://github.com/vyuvaraj/Pranor Deploy"
    description: "Cloud infrastructure orchestration service from the ServVerse platform"
    license: "Apache-2.0"
    install: |
      bin.install "pranor-deploy"
    test: |
      system "#{bin}/pranor-deploy", "--version"

scoops:
  - repository:
      owner: vyuvaraj
      name: scoop-serv
    homepage: "https://github.com/vyuvaraj/Pranor Deploy"
    description: "Cloud infrastructure orchestration service from the ServVerse platform"
    license: "Apache-2.0"


nfpms:
  - id: pranor-deploy-pkg
    package_name: pranor-deploy
    builds: [pranor-deploy]
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/Pranor Deploy
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: Branch preview deployments and cloud orchestration from the ServVerse platform
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/pranor-deploy/README.md
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
release:
  mode: replace
