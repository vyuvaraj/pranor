apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pranor-pulseclusters.serv.dev
spec:
  group: serv.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  default: 3
                image:
                  type: string
                  default: "ghcr.io/vyuvaraj/pranor-pulse:latest"
                storageSize:
                  type: string
                  default: "10Gi"
                stompPort:
                  type: integer
                  default: 61613
                httpPort:
                  type: integer
                  default: 8082
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
  scope: Namespaced
  names:
    plural: pranor-pulseclusters
    singular: pranor-pulsecluster
    kind: Pranor PulseCluster
    shortNames:
      - sqc
