[book]
title = "Pranor Documentation"
authors = ["vyuvaraj"]
language = "en"
src = "."

[build]
build-dir = "_site"

[output.html]
default-theme = "navy"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/vyuvaraj/pranor"
