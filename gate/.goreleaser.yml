project_name: pranor-gate
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pranor-gate
    main: .
    binary: pranor-gate
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: pranor-gate
    builds: [pranor-gate]
    name_template: "pranor-gate_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - config.json

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/vyuvaraj/pranor-gate:{{.Tag}}"
      - "ghcr.io/vyuvaraj/pranor-gate:latest"
    # goreleaser builds in a temp dir with only the binary + Dockerfile.
    # Dockerfile.goreleaser expects a pre-built binary (no source build stage).
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.json
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Pranor Gate"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/vyuvaraj/Pranor Gate"

brews:
  - name: pranor-gate
    repository:
      owner: vyuvaraj
      name: homebrew-pranor
    homepage: "https://github.com/vyuvaraj/Pranor Gate"
    description: "High-performance API gateway and reverse proxy from the Pranor platform"
    license: "Apache-2.0"
    install: |
      bin.install "pranor-gate"
    test: |
      system "#{bin}/pranor-gate", "--version"

scoops:
  - repository:
      owner: vyuvaraj
      name: scoop-pranor
    homepage: "https://github.com/vyuvaraj/Pranor Gate"
    description: "High-performance API gateway and reverse proxy from the Pranor platform"
    license: "Apache-2.0"


nfpms:
  - id: pranor-gate-pkg
    package_name: pranor-gate
    builds: [pranor-gate]
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/Pranor Gate
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: High-performance API gateway and reverse proxy from the Pranor platform
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/pranor-gate/README.md
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
release:
  mode: replace
