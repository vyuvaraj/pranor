project_name: pranor-tunnel
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pranor-tunnel
    main: .
    binary: pranor-tunnel
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: pranor-tunnel
    builds: [pranor-tunnel]
    name_template: "pranor-tunnel_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/vyuvaraj/pranor-tunnel:{{.Tag}}"
      - "ghcr.io/vyuvaraj/pranor-tunnel:latest"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Pranor Tunnel"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/vyuvaraj/Pranor Tunnel"

brews:
  - name: pranor-tunnel
    repository:
      owner: vyuvaraj
      name: homebrew-pranor
    homepage: "https://github.com/vyuvaraj/Pranor Tunnel"
    description: "Secure tunneling and port-forwarding service from the Pranor platform"
    license: "Apache-2.0"
    install: |
      bin.install "pranor-tunnel"
    test: |
      system "#{bin}/pranor-tunnel", "--version"

scoops:
  - repository:
      owner: vyuvaraj
      name: scoop-pranor
    homepage: "https://github.com/vyuvaraj/Pranor Tunnel"
    description: "Secure tunneling and port-forwarding service from the Pranor platform"
    license: "Apache-2.0"


nfpms:
  - id: pranor-tunnel-pkg
    package_name: pranor-tunnel
    builds: [pranor-tunnel]
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/Pranor Tunnel
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: Secure tunnel and proxy service from the Pranor platform
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/pranor-tunnel/README.md
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
release:
  mode: replace
