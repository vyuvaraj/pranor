project_name: pranor-console
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pranor-console
    main: .
    binary: pranor-console
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: pranor-console
    builds: [pranor-console]
    name_template: "pranor-console_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/vyuvaraj/pranor-console:{{.Tag}}"
      - "ghcr.io/vyuvaraj/pranor-console:latest"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - web/
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Pranor Console"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/vyuvaraj/Pranor Console"

brews:
  - name: pranor-console
    repository:
      owner: vyuvaraj
      name: homebrew-serv
    homepage: "https://github.com/vyuvaraj/Pranor Console"
    description: "Management console and dashboard for the ServVerse platform"
    license: "Apache-2.0"
    install: |
      bin.install "pranor-console"
    test: |
      system "#{bin}/pranor-console", "--version"

scoops:
  - repository:
      owner: vyuvaraj
      name: scoop-serv
    homepage: "https://github.com/vyuvaraj/Pranor Console"
    description: "Management console and dashboard for the ServVerse platform"
    license: "Apache-2.0"


nfpms:
  - id: pranor-console-pkg
    package_name: pranor-console
    builds: [pranor-console]
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/Pranor Console
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: Admin console and observability dashboard from the ServVerse platform
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/pranor-console/README.md
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
release:
  mode: replace
