---
# ClusterRole — Operator needs full access to Pranor Vault CRDs and core resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pranor-vault.fullname" . }}-operator
  labels:
    {{- include "pranor-vault.labels" . | nindent 4 }}
rules:
# Pranor Vault CRDs
- apiGroups: ["storage.pranor-vault.io"]
  resources:
  - pranor-vaultclusters
  - pranor-vaultclusters/status
  - pranor-vaultclusters/finalizers
  - pranor-vaultbuckets
  - pranor-vaultbuckets/status
  - pranor-vaultcredentials
  - pranor-vaultcredentials/status
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Core resources the operator manages
- apiGroups: ["apps"]
  resources: ["statefulsets", "statefulsets/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "pods", "pods/status", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Events for status reporting
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Leader election
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pranor-vault.fullname" . }}-operator
  labels:
    {{- include "pranor-vault.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "pranor-vault.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "pranor-vault.fullname" . }}-operator
  apiGroup: rbac.authorization.k8s.io
