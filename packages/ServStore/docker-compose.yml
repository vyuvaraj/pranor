# ServStore Standalone Daemon & Admin Console
# Usage: docker compose up -d
# S3 API:          http://localhost:9000 (access-key: minioadmin, secret-key: minioadmin)
# Admin Console:   http://localhost:9001/ui/

services:
  servstore:
    build: .
    container_name: servstore
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # Admin Console & Management Port
    volumes:
      - store-data:/data
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    restart: unless-stopped

volumes:
  store-data:
