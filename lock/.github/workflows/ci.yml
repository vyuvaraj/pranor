name: PranorLock CI

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Build · Test · Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PranorCore
        uses: actions/checkout@v4
        with:
          repository: vyuvaraj/PranorCore
          path: PranorCore

      - name: Checkout PranorLock
        uses: actions/checkout@v4
        with:
          path: PranorLock

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: PranorLock/go.sum

      - name: Build
        working-directory: PranorLock
        run: go build ./...

      - name: Vet
        working-directory: PranorLock
        run: go vet ./...

      - name: Test
        working-directory: PranorLock
        run: go test ./... -timeout 120s
