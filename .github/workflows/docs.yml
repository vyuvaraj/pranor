name: Deploy Documentation (Versioned v1.0 & v2.0)

# =============================================================================
# Pranor Versioned Documentation Pipeline
#
# Builds versioned mdBook documentation for GitHub Pages:
#   - /pranor/       -> Redirects to /pranor/v1.0/
#   - /pranor/v1.0/  -> Built from v1.0.0 release tag (Stable v1.0 docs)
#   - /pranor/v2.0/  -> Built from v2.0-dev branch (v2.0 AI Execution Fabric docs)
# =============================================================================

on:
  push:
    branches: [main, v2.0-dev]
    tags: ["v*.*.*"]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (v2.0-dev)
        uses: actions/checkout@v4
        with:
          ref: v2.0-dev
          path: repo-v2

      - name: Checkout repository (v1.0.0)
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: repo-v1

      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Prepare site directory structure
        run: |
          mkdir -p site_out/v1.0
          mkdir -p site_out/v2.0

      - name: Build v1.0 Stable Documentation
        run: |
          cd repo-v1
          # Configure mdBook site-url for /pranor/v1.0/
          sed -i 's|site-url = "/pranor/"|site-url = "/pranor/v1.0/"|g' docs/book.toml
          mdbook build docs/
          cp -r docs/_site/* ../site_out/v1.0/

      - name: Build v2.0 Preview Documentation
        run: |
          cd repo-v2
          # Configure mdBook site-url for /pranor/v2.0/
          sed -i 's|site-url = "/pranor/"|site-url = "/pranor/v2.0/"|g' docs/book.toml
          mdbook build docs/
          cp -r docs/_site/* ../site_out/v2.0/

      - name: Create Root Redirect (index.html)
        run: |
          cat << 'EOF' > site_out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/pranor/v1.0/">
              <script>window.location.href = "/pranor/v1.0/";</script>
              <title>Pranor Documentation</title>
              <style>
                  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
                  .container { text-align: center; }
                  a { color: #38bdf8; text-decoration: none; font-weight: bold; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h2>Redirecting to Pranor Documentation...</h2>
                  <p>If you are not redirected automatically, select a version:</p>
                  <p><a href="/pranor/v1.0/">v1.0 (Stable Release)</a> | <a href="/pranor/v2.0/">v2.0 (AI Execution Fabric Dev)</a></p>
              </div>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
